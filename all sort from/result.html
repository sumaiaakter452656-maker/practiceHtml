<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <style>
        table {text-align: center;
            ;}
            table {width: 50%;}
    </style>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="4" style="border-collapse: collapse;">
        <tr>
            <th>Name</th>
            <th rowspan="4" style="text-align: left;">Result</th>
            <th>Class</th>
            <th>Mark</th>
        </tr>
        <tr>
            <td>Toufik</td>
            
            <td>V</td>
            <td>90</td>
        </tr> 
        <tr>
            <td>Sumon</td>
           
            <td>VI</td>
            <td>80</td>
        </tr>
    </table>
</body>
</html>
