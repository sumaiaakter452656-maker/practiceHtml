<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>account enty from</h2>
    <form action="">
        <label for="">First Name:</label> <br>
        <input type="text" name="First Name" placeholder="Enter your First Name"> <br>  <br>

        <label for="">Last Name:</label> <br>
        <input type="text" name="Last Name" placeholder="Enter your Last Name"> <br> <br>

        <label for="">Email:</label> <br>
        <input type="text" name="email" placeholder="Enter your Email"> <br>  <br>

        <label for="">Password</label> <br>
        <input type="text" placeholder="Enter your password"> <br> <br>

        <label for="">Confirm password</label> <br>
        <input type="text" placeholder="Confirm password"> <br> <br>

        <label for="">Gender</label><br>
        <input type="radio" name="Gender" id="male" >Male
        <input type="radio" name="Gender" id="Female" >Female
        <input type="radio" name="Gender" id="Others" >Others <br><br>

        <label for="">Hobbies</label><br>
        <input type="checkbox" name="Music" value="Music">Music
        <input type="checkbox" name="Sports" value="Sports">Sports
        <input type="checkbox" name="Travel" value="Travel">Travel
        <input type="checkbox" name="Movies" value="Movies">Movies <br><br>

        <label for="">Source of Income</label> <br>
        <select name="dropdown list" >
            <option value="">Select</option>
            <option value="Employed">Employed</option>
             <option value="Student">Student</option>
        </select><br><br>

        <label for="">Upload Profile Picture</label><br>
        <input type="file"> <br><br>


        <label for="">Age</label> <br>
        <input type="number" name="Age" value="number"><br><br>


        <label for="">Biography</label><br>
        <textarea cols="20" rows="10"></textarea><br><br>


        <label for="">Submit</label><br>
        <input type="text" value="submit">
</body>
</html>
