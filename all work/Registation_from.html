<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic_info</title>
</head>
<body>
    <form>
        <label for="">Id:</label>
        <input type="text" >
        <br><br>

        <label for="">Name:</label>
        <textarea name="Name" id="" placeholder="Enter your name"></textarea>
        <br><br>

        <label for="">Round</label>
        <select name="" id="">
         <option value="select round">Select round</option>  
         <option value="">Round-73</option> 
         <option value="">Round-72</option>
         <option value="">Round-71</option>
        </select>
        <br><br>

        <label for="">Gender</label><BR></BR>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female">female
        <br><br>

        <label for="">Education:</label><br>
        <input type="checkbox" id="ssc" name="Education" value="ssc">SSC
        <input type="checkbox" id="hsc" name="Education" value="hsc">HSC
        <BR><BR>

        <label for="">CV:</label><br>
        <input type="file" placeholder="upload a file" >
        <br><br>

        <input type="submit" value="submit">&nbsp;&nbsp;
        <input type="reset" value="reset">

        
        
    </form>
</body>
</html>
