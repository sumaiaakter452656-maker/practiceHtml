<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: lightblue;
        }
        fieldset {
            background-color: lightgray;
            width: 50%;
           margin: auto;
        }
    </style>
</head>
<body>
    <fieldset>
        <form action="">
            <label for="Firstname">Name:</label>
            <input type="text" id="Firstname" name="Firstname" placeholder="Enter your Firstname"><br><br>

            <label  for="Lastname">Last Name:</label>
            <input type="text" id="Lastname" name="Lastname" placeholder="Enter your Lastname"><br><br>

            <label for="Date of Birth">Date of Birth:</label>
            <input type="date" id="date of Birth" name="date of Birth"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email"><br><br> 

            <label for="phone">Mobile No:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number"><br><br>  

            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">Male
            <input type="radio" id="female" name="gender" value="female">Female <br><br>

            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="Select country">Select country</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
            </select><br><br>

            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="Select state">Select state</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="California">California</option>
                <option value="London">London</option>
            </select><br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" placeholder="Enter your Address"><br><br>

            <label for="pincode">Pin Code:</label>
            <input type="text" id="pincode" name="pincode" placeholder="Enter your Pincode"><br><br>

            <label for="City">City:</label>
            <input type="text" id="City" name="City" placeholder="Enter your City"><br><br>

            <label for="District">District:</label>
            <select id="District" name="District">
                <option value="Select district">Select district</option>
                <option value="Mumbai">Mumbai</option>
            </select><br><br>

            <label for="Hobbies">Hobbies:</label>
            <textarea id="Hobbies" name="Hobbies" rows="4" cols="50" placeholder="Enter your Hobbies"></textarea><br><br>

            <input type="submit" value="Submit">
        </form>
    </fieldset>
</body>
</html>
