<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
</head>
<body>

<form action="#" method="post">

  <label for="id">ID:</label><br>
  <input type="text" id="id" name="id"><br><br>

  <label for="name">Name:</label><br>
  <textarea id="name" name="name" rows="3" cols="30"></textarea><br><br>

  <label for="round">Round:</label><br>
  <select id="round" name="round">
    <option value="1">Round 1</option>
    <option value="2">Round 2</option>
    <option value="3">Round 3</option>
  </select><br><br>

  <label>Gender:</label><br>
  <input type="radio" id="male" name="gender" value="male">
  <label for="male">Male</label>

  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label><br><br>

  <label>Education:</label><br>
  <input type="checkbox" id="ssc" name="education" value="SSC">
  <label for="ssc">SSC</label>

  <input type="checkbox" id="hsc" name="education" value="HSC">
  <label for="hsc">HSC</label><br><br>

  <label for="cv">CV Upload:</label><br>
  <input type="file" id="cv" name="cv"><br><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">

</form>

</body>
</html>
