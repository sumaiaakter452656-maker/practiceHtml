
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Entry</title>
</head>
<body>
    <h2>Product Entry Form</h2>
    <form>
        <!-- a. ID - text box -->
        <label for="id">ID:</label>
        <input type="text" id="id" name="id"><br><br>

        <!-- b. Name - text box -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <!-- c. Type - list box (select) -->
        <label for="type">Type:</label>
        <select id="type" name="type">
            <option value="food">Food</option>
            <option value="soap">Soap</option>
            <option value="shampoo">Shampoo</option>
        </select><br><br>

        <!-- d. Imported - check box -->
        <label for="imported">Imported:</label>
        <input type="checkbox" id="imported" name="imported"><br><br>

        <!-- e. Price - text box -->
        <label for="price">Price:</label>
        <input type="text" id="price" name="price"><br><br>

        <!-- f. Manufacturer - text area -->
        <label for="manufacturer">Manufacturer:</label><br>
        <textarea id="manufacturer" name="manufacturer" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
