<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspeacing="0" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th rowspan="2">Name</th>
                <th rowspan="2"></th>
                <th rowspan="2">Round</th>
                <th colspan="2">Mark</th>
            </tr>
            <tr>
                <th>MCQ</th>
                <th>descriptive</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="text-align: left;">Masud Sardar</td>
                <td rowspan="2">result</td>
                <td>WDPF-60</td>
                <td>45</td>
                <td>40</td>
            </tr>
            <tr> 
                <td style="text-align: left;" >Saif Jahan</td>
                <td>WDPF-60</td>
                <td>49</td>
                <td>45</td>
             </tr>
        </tbody>
    </table>
    
</body>
</html>
