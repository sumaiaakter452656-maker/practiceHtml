<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H2>PRODUCT_ENTY.HTML</H2>
    <form action="">
        <label for="">Product name</label><br>
        <input type="text" id="name"><br><br>


        <label for="">Description</label><br>
        <textarea name="Description" col="20" row="10"></textarea><br><br>


        <label for="">Categories</label><br>
        <select name="dropdown list" id="dropdown list" >
             <option value="">Select</option>
            <option value="Man">Man</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
        </select><br><br>


        <label for="">Features</label><br>
        <input type="checkbox" name="Cotton" value="Cotton">Cotton
        <input type="checkbox" name="Woolen" value="Woolen">Woolen
        <input type="checkbox" name="Polyester" value="Polyester">Polyester
        <input type="checkbox" name="Full Sleeves" value="Full Sleeves">Full Sleeves <br><br>


        <label for="">Product Photo</label><br>
        <input type="file" id="photo"><br><br>


        <label for="">Stock</label><br>
        <input type="number" id="number"><br><br>


         <input type="submit" value="submit">&nbsp;&nbsp;
        <input type="reset" value="reset">
    </form>
    
</body>
</html>
